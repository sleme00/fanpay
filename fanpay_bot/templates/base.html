<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "FanPay Analytics" }}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b101a;
      --panel: #111827;
      --panel-light: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-strong: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0b101a 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 28px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid #1f2937;
    }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      padding: 24px 32px 48px;
    }
    .sidebar {
      background: var(--panel);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      height: fit-content;
    }
    .sidebar h2 { margin-top: 0; font-size: 16px; }
    .sidebar form { display: flex; flex-direction: column; gap: 12px; }
    .content { display: flex; flex-direction: column; gap: 20px; }
    .card {
      background: var(--panel);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    }
    .card h2 { margin-top: 0; font-size: 18px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--accent-strong);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .btn.secondary { background: #334155; }
    .btn.ghost { background: transparent; border: 1px solid #334155; color: var(--text); }
    input, select {
      background: var(--panel-light);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
    }
    label { font-size: 13px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #1f2937; text-align: left; }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
    .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #1e3a8a; color: #bfdbfe; }
    .pill { background: #0f172a; border: 1px solid #334155; padding: 6px 12px; border-radius: 999px; font-size: 12px; color: var(--muted); }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .notice { color: var(--muted); font-size: 13px; }
    .error { color: var(--danger); font-weight: 600; }
    .highlight { color: var(--success); font-weight: 600; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>FanPay Analytics Lab</h1>
      <p>Рынок, спрос и тренды в одном экране.</p>
    </div>
    <a class="btn ghost" href="{{ url_for('index') }}">Главная</a>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
